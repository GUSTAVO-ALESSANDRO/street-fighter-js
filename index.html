<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Street Fighter Lite</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div id="tela-menu" class="modal-menu">
    <div class="caixa-menu">
      <h1>Street Fighter Lite</h1>
      
      <div class="grupo-campo">
        <label for="seletor-modo">Modo de Jogo:</label>
        <select id="seletor-modo">
          <option value="pvp">Jogador vs Jogador (PvP)</option>
          <option value="pvc">Jogador vs PC</option>
        </select>
      </div>

      <!-- Escolha dos Lutadores -->
      <div class="grupo-campo campos-em-linha">
        <div>
          <label for="seletor-p1">Jogador 1:</label>
          <select id="seletor-p1">
            <!-- Personagens colocados dinamicamente pelo js -->
          </select>
        </div>
        <div>
          <label for="seletor-p2">Jogador 2:</label>
          <select id="seletor-p2">
            <!-- Personagens colocados dinamicamente pelo js -->
          </select>
        </div>
      </div>

      <!-- Escolha do Cenário -->
      <div class="grupo-campo">
        <label for="seletor-cenario">Cenário:</label>
        <select id="seletor-cenario">
            <!-- Cenários colocados dinamicamente pelo js -->
        </select>
      </div>

      <button id="botao-iniciar" class="botao">INICIAR LUTA</button>
    </div>
  </div>

  <div id="container-jogo">
    <div id="painel-hud">
      <div class="hud-jogador">
        <p id="nome-p1" class="rotulo-jogador">P1:</p>
        <div class="barra-vida-externa">
          <div id="vida-p1" class="barra-vida-interna"></div>
        </div>
      </div>

      <div class="caixa-temporizador">
        <p id="tempo-jogo">99</p>
      </div>

      <div class="hud-jogador alinhar-direita">
        <p id="nome-p2" class="rotulo-jogador">:P2</p>
        <div class="barra-vida-externa">
          <div id="vida-p2" class="barra-vida-interna"></div>
        </div>
      </div>
    </div>

    <!-- Tela do Jogo em Canvas -->
    <canvas id="canvasJogo" width="960" height="540"></canvas>
  </div>

  <!-- Scripts JavaScript -->
  <script src="js/Ui.js"></script>
  <script src="js/InputHandler.js"></script>
  <script src="js/Character.js"></script>
  <script src="js/Bot.js"></script>
  <script src="js/Main.js"></script>
</body>
</html>
