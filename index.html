<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Street Figther Lite</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- MENU DE SELEÇÃO -->
  <div id="menu" class="overlay-screen">
    <div class="menu-box">
      <h1>Street Figther Lite</h1>
      
      <!-- Escolha do Modo -->
      <div class="field-group">
        <label for="mode-select">Modo de Jogo:</label>
        <select id="mode-select">
          <option value="pvp">Jogador vs Jogador (PvP)</option>
          <option value="pvc">Jogador vs PC</option>
        </select>
      </div>

      <!-- Escolha dos Lutadores -->
      <div class="field-group inline-fields">
        <div>
          <label for="p1-select">Lutador P1:</label>
          <select id="p1-select">
            <option value="ryu">Ryu</option>
            <option value="ken">Ken</option>
          </select>
        </div>
        <div>
          <label for="p2-select">Lutador P2 / PC:</label>
          <select id="p2-select">
            <option value="ken">Ken</option>
            <option value="ryu">Ryu</option>
          </select>
        </div>
      </div>

      <!-- Escolha do Cenário -->
      <div class="field-group">
        <label for="bg-select">Cenário:</label>
        <select id="bg-select">
          <option value="cenario1">Cenário 1 (Rua)</option>
          <option value="cenario2">Cenário 2 (Templo)</option>
        </select>
      </div>

      <button id="start-btn" class="btn">INICIAR LUTA</button>
    </div>
  </div>

  <!-- ÁREA DE COMBATE E INTERFACE -->
  <div id="game-container">
    <!-- HUD: Barras de Vida Flutuantes -->
    <div id="hud">
      <div class="player-hud">
        <span id="p1-name" class="player-label">P1: RYU</span>
        <div class="life-bar-outer">
          <div id="p1-life" class="life-bar-inner"></div>
        </div>
      </div>

      <div class="timer-box">
        <span id="game-timer">99</span>
      </div>

      <div class="player-hud align-right">
        <span id="p2-name" class="player-label">P2: KEN</span>
        <div class="life-bar-outer">
          <div id="p2-life" class="life-bar-inner"></div>
        </div>
      </div>
    </div>

    <!-- Tela do Jogo em Canvas -->
    <canvas id="gameCanvas" width="960" height="540"></canvas>
  </div>

  <script src="js/Ui.js"></script>
  <script src="js/InputHandler.js"></script>
  <script src="js/Character.js"></script>
  <script src="js/Bot.js"></script>
  <script src="js/Main.js"></script>
</body>
</html>
